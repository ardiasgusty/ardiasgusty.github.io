<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#d71920" />
  <title>Honda Street Rush</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="home" aria-label="Kembali ke home">
        <span class="brand-mark">H</span>
        <span><b>STREET RUSH</b><small>Browser Racing Prototype</small></span>
      </button>
      <div class="topbar-actions">
        <span id="networkBadge" class="badge muted">OFFLINE</span>
        <button class="icon-btn" data-action="sound" aria-label="Toggle sound">🔊</button>
      </div>
    </header>

    <main id="app"></main>
  </div>

  <template id="homeTemplate">
    <section class="hero-screen screen">
      <div class="hero-copy">
        <div class="eyebrow">HONDA STREET RUSH</div>
        <h1>Balapan Honda<br><span>keliling Indonesia.</span></h1>
        <p>Pilih mobil, pilih kota, dan kejar garis finish. Main solo atau mabar lewat kode room.</p>
        <div class="hero-actions">
          <button class="primary xl" data-action="solo">SOLO RACE</button>
          <button class="secondary xl" data-action="multiplayer">MULTIPLAYER</button>
        </div>
      </div>
      <div class="hero-visual" aria-hidden="true">
        <div class="city-silhouette"></div>
        <div class="road-perspective"></div>
        <div class="hero-car"><span>TYPE R</span></div>
      </div>
      <div class="home-stats">
        <div><b id="homeCars">0</b><span>Mobil</span></div>
        <div><b id="homeMaps">0</b><span>Map</span></div>
        <div><b>1–6</b><span>Player</span></div>
      </div>
    </section>
  </template>

  <template id="selectTemplate">
    <section class="screen select-screen">
      <div class="section-head">
        <button class="back-btn" data-action="back">←</button>
        <div>
          <div class="eyebrow" id="selectEyebrow">GARAGE</div>
          <h2 id="selectTitle">Pilih Mobil</h2>
        </div>
        <div class="stepper"><span class="active">1</span><i></i><span>2</span></div>
      </div>
      <div id="cardGrid" class="card-grid"></div>
      <div class="sticky-action">
        <div id="selectionSummary"></div>
        <button id="selectContinue" class="primary" disabled>LANJUT</button>
      </div>
    </section>
  </template>

  <template id="multiplayerTemplate">
    <section class="screen multiplayer-screen">
      <div class="section-head">
        <button class="back-btn" data-action="home">←</button>
        <div><div class="eyebrow">ONLINE</div><h2>Multiplayer</h2></div>
      </div>
      <div class="multi-layout">
        <div class="panel big-panel">
          <div class="panel-title"><span class="status-dot"></span> MABAR DENGAN KODE ROOM</div>
          <h3>Balapan bareng teman.</h3>
          <p>Buat room untuk mendapatkan kode 6 karakter, lalu bagikan ke temanmu.</p>
          <label class="field"><span>Nama pemain</span><input id="playerName" maxlength="18" placeholder="Contoh: Gusti" /></label>
          <div class="button-row">
            <button id="createRoomBtn" class="primary">CREATE ROOM</button>
          </div>
          <div class="join-box">
            <div class="divider"><span>atau join room</span></div>
            <div class="join-row">
              <input id="roomCodeInput" maxlength="6" placeholder="ABC123" autocapitalize="characters" />
              <button id="joinRoomBtn" class="secondary">JOIN</button>
            </div>
          </div>
        </div>
        <div class="panel setup-panel">
          <div class="panel-title">SUPABASE CONNECTION</div>
          <div id="supabaseStatus" class="connection-status"></div>
          <p class="small">Cukup isi sekali. Data disimpan di browser ini.</p>
          <label class="field"><span>Project URL</span><input id="supabaseUrl" placeholder="https://xxxx.supabase.co" /></label>
          <label class="field"><span>Publishable / anon key</span><textarea id="supabaseKey" rows="4" placeholder="sb_publishable_... atau eyJ..."></textarea></label>
          <button id="saveSupabaseBtn" class="ghost">SIMPAN KONFIGURASI</button>
          <p class="hint">GitHub Pages tetap menjadi hosting game. Supabase hanya menangani komunikasi real-time.</p>
        </div>
      </div>
    </section>
  </template>

  <template id="lobbyTemplate">
    <section class="screen lobby-screen">
      <div class="section-head">
        <button class="back-btn" id="leaveRoomBtn">←</button>
        <div><div class="eyebrow">PRIVATE ROOM</div><h2>Race Lobby</h2></div>
        <span id="hostBadge" class="badge">PLAYER</span>
      </div>
      <div class="room-banner">
        <span>ROOM CODE</span>
        <strong id="roomCodeDisplay">------</strong>
        <button id="copyRoomBtn" class="ghost small-btn">COPY</button>
      </div>
      <div class="lobby-layout">
        <div class="panel">
          <div class="panel-title">PLAYERS <span id="playerCount">0 / 6</span></div>
          <div id="playerList" class="player-list"></div>
        </div>
        <div class="panel lobby-settings">
          <div class="panel-title">RACE SETUP</div>
          <label class="field"><span>Map</span><select id="lobbyMap"></select></label>
          <label class="field"><span>Lap</span><select id="lobbyLaps"><option value="1">1 Lap</option><option value="3" selected>3 Lap</option><option value="5">5 Lap</option></select></label>
          <label class="field"><span>Mobil kamu</span><select id="lobbyCar"></select></label>
          <button id="readyBtn" class="secondary full">READY</button>
          <button id="startRaceBtn" class="primary full">START RACE</button>
          <p id="lobbyMessage" class="hint center"></p>
        </div>
      </div>
    </section>
  </template>

  <template id="raceTemplate">
    <section class="race-screen">
      <canvas id="raceCanvas"></canvas>
      <div class="race-hud">
        <div class="hud-left">
          <div class="hud-pill"><span>POS</span><b id="hudPosition">1/6</b></div>
          <div class="hud-pill"><span>LAP</span><b id="hudLap">1/3</b></div>
        </div>
        <div class="hud-map"><span id="hudMap">MONAS SPRINT</span></div>
        <button id="pauseBtn" class="hud-pause">Ⅱ</button>
      </div>
      <div class="speedometer"><strong id="hudSpeed">0</strong><span>KM/H</span><div class="boost-bar"><i id="boostFill"></i></div><small>BOOST</small></div>
      <div id="countdown" class="countdown">3</div>
      <div class="mobile-controls">
        <button id="leftBtn">◀</button>
        <button id="boostBtn" class="boost-btn">BOOST</button>
        <button id="rightBtn">▶</button>
      </div>
      <div id="raceOverlay" class="race-overlay hidden"></div>
    </section>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
