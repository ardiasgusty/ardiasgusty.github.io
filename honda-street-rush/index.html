<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Honda Street Rush V2</title>
  <meta name="theme-color" content="#08090d" />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <section id="menu" class="panel menu-panel">
      <div class="eyebrow">HONDA STREET RUSH</div>
      <h1>Jakarta — Monas Sprint</h1>
      <p class="subtitle">Prototype V2: 3D, collision, track natural, dan mini map.</p>

      <label class="field-label" for="carSelect">Pilih mobil</label>
      <select id="carSelect">
        <option value="brio">Honda Brio RS</option>
        <option value="wrv">Honda WR-V RS</option>
        <option value="hrv">Honda HR-V e:HEV</option>
        <option value="civic">Honda Civic RS</option>
        <option value="typer">Honda Civic Type R</option>
      </select>

      <div class="car-stats" id="carStats"></div>

      <button id="startBtn" class="primary">START RACE</button>
      <p class="help">PC: W/↑ gas, S/↓ rem, A/D atau ←/→ belok, Shift boost. HP: tombol layar.</p>
    </section>

    <div id="hud" class="hidden">
      <div class="top-left hud-card">
        <div class="small">POSISI</div>
        <div class="big"><span id="position">1</span><span class="muted"> / 6</span></div>
      </div>
      <div class="top-center hud-card compact">
        <span id="lapText">LAP 1 / 3</span>
      </div>
      <div class="speed hud-card">
        <div class="speed-num" id="speed">0</div>
        <div class="small">KM/H</div>
        <div class="boost-wrap"><div id="boostBar"></div></div>
        <div class="tiny">BOOST</div>
      </div>
      <canvas id="minimap" width="220" height="170"></canvas>
      <div id="impact" class="impact hidden">BRAK!</div>
    </div>

    <div id="countdown" class="countdown hidden">3</div>

    <div id="mobileControls" class="mobile-controls hidden">
      <div class="left-controls">
        <button data-key="left">◀</button>
        <button data-key="right">▶</button>
      </div>
      <div class="right-controls">
        <button data-key="brake" class="brake">BRAKE</button>
        <button data-key="gas" class="gas">GAS</button>
        <button data-key="boost" class="boost">BOOST</button>
      </div>
    </div>

    <section id="result" class="panel result-panel hidden">
      <div class="eyebrow">RACE COMPLETE</div>
      <h2 id="resultTitle">FINISH!</h2>
      <p id="resultDetail"></p>
      <button id="againBtn" class="primary">RACE AGAIN</button>
      <button id="menuBtn" class="secondary">BACK TO GARAGE</button>
    </section>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
